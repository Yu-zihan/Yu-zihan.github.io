<meta charset="utf-8">
<title>三元概率单纯形是怎么来的</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
  /* 背景留空，嵌到页面里会自动透出你网站自己的底色。
     想单独打开看得舒服一点就把下面这行的 transparent 换成具体颜色。 */
  html, body { margin: 0; background: transparent; }
  body {
    font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: #2c3e50;
  }
  #wrap { max-width: 760px; margin: 0 auto; }
  #plot { width: 100%; height: 480px; }
  #bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center; padding: 4px 0 10px;
  }
  button {
    font: inherit; font-size: 13px;
    padding: 5px 12px; border-radius: 6px;
    border: 1px solid rgba(44, 62, 80, .28);
    background: rgba(0, 0, 0, .035); color: inherit; cursor: pointer;
  }
  button:hover { background: rgba(0, 0, 0, .08); }
  button[aria-pressed="false"] { opacity: .5; }
  #hint { text-align: center; font-size: 12.5px; opacity: .6; padding-bottom: 6px; }
</style>

<div id="wrap">
  <div id="plot"></div>
  <div id="bar">
    <button id="btnPlane" aria-pressed="true">归一化平面</button>
    <button id="btnFront">正对单纯形看</button>
    <button id="btnReset">回到默认视角</button>
  </div>
  <div id="hint">拖动可旋转，滚轮缩放</div>
</div>

<script>
(function () {
  const INK = '#2c3e50', RED = '#e05a4f', GRID = 'rgba(44,62,80,.18)';
  const LO = -0.6, HI = 1.6;

  // ---- 归一化平面 p1+p2+p3=1，即 z = 1-x-y ----
  const n = 2, xs = [LO, HI], ys = [LO, HI];
  const z = ys.map(y => xs.map(x => 1 - x - y));
  const plane = {
    type: 'surface', x: xs, y: ys, z: z,
    opacity: 0.22, showscale: false,
    colorscale: [[0, '#7f8c8d'], [1, '#7f8c8d']],
    hoverinfo: 'skip', name: '平面'
  };

  // ---- 被非负卦限截出来的三角形 ----
  const V = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  const simplex = {
    type: 'mesh3d',
    x: V.map(v => v[0]), y: V.map(v => v[1]), z: V.map(v => v[2]),
    i: [0], j: [1], k: [2],
    color: RED, opacity: 0.55, flatshading: true, hoverinfo: 'skip'
  };
  const edges = {
    type: 'scatter3d', mode: 'lines',
    x: [1, 0, 0, 1], y: [0, 1, 0, 0], z: [0, 0, 1, 0],
    line: { color: INK, width: 5 }, hoverinfo: 'skip'
  };
  const verts = {
    type: 'scatter3d', mode: 'markers+text',
    x: V.map(v => v[0]), y: V.map(v => v[1]), z: V.map(v => v[2]),
    marker: { size: 5, color: INK },
    text: ['(1,0,0)', '(0,1,0)', '(0,0,1)'],
    textposition: 'top center',
    textfont: { size: 13, color: INK },
    hovertemplate: 'p = (%{x}, %{y}, %{z})<extra></extra>'
  };
  // 三条坐标轴，帮着看清"第一卦限"
  const axes3 = {
    type: 'scatter3d', mode: 'lines',
    x: [0, 1.35, null, 0, 0, null, 0, 0],
    y: [0, 0, null, 0, 1.35, null, 0, 0],
    z: [0, 0, null, 0, 0, null, 0, 1.35],
    line: { color: 'rgba(44,62,80,.45)', width: 2 }, hoverinfo: 'skip'
  };

  const ax = t => ({
    title: { text: t, font: { size: 14, color: INK } },
    range: [LO, HI], zeroline: false, dtick: 0.5,
    gridcolor: GRID, linecolor: GRID,
    tickfont: { size: 10, color: 'rgba(44,62,80,.65)' },
    backgroundcolor: 'rgba(0,0,0,0)', showbackground: true
  });

  const DEFAULT_CAM = { eye: { x: 1.32, y: 1.00, z: 0.78 }, up: { x: 0, y: 0, z: 1 },
                        center: { x: 0, y: 0, z: 0 } };
  // 沿 (1,1,1) 方向看过去，三角形正好投影成正三角形
  const FRONT_CAM = { eye: { x: 1.02, y: 1.02, z: 1.02 }, up: { x: 0, y: 0, z: 1 },
                      center: { x: 0, y: 0, z: 0 } };

  const layout = {
    margin: { l: 0, r: 0, t: 8, b: 0 },
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    showlegend: false,
    scene: {
      xaxis: ax('p₁'), yaxis: ax('p₂'), zaxis: ax('p₃'),
      aspectmode: 'cube',
      camera: DEFAULT_CAM
    }
  };

  const el = document.getElementById('plot');
  Plotly.newPlot(el, [plane, simplex, edges, verts, axes3], layout,
                 { displayModeBar: false, responsive: true });

  const cam = c => Plotly.relayout(el, { 'scene.camera': c });
  document.getElementById('btnFront').onclick = () => cam(FRONT_CAM);
  document.getElementById('btnReset').onclick = () => cam(DEFAULT_CAM);

  const bp = document.getElementById('btnPlane');
  bp.onclick = () => {
    const on = bp.getAttribute('aria-pressed') === 'true';
    bp.setAttribute('aria-pressed', String(!on));
    Plotly.restyle(el, { visible: on ? false : true }, [0]);
  };
})();
</script>
