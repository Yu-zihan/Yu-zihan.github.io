<script>
  (function () {
    var path = window.location.pathname;
    var root = document.documentElement;

    if (/\/(?:en\/|zh\/)?(notes|blog)\//.test(path)) {
      root.classList.add("notes-site");
    }

    if (/\/(?:en\/|zh\/)?(notes|blog)\/index\.html$/.test(path)) {
      root.classList.add("notes-list");
    } else if (/\/(?:en\/|zh\/)?(notes|blog)\/.+\.html$/.test(path)) {
      root.classList.add("notes-article");
    }
  })();
</script>

<script defer src="/assets/notes.js?v=notes-mobile"></script>
