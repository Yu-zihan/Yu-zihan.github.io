<link rel="stylesheet" href="/assets/vendor/katex/katex.min.css">
<style>
  :root {
    --katex-font-size: 1.06em;
    --katex-frac-line-font-size: 1.3em;
  }

  .katex {
    line-height: 1.26;
  }

  .math.math-inline,
  .katex {
    text-wrap: pretty;
  }

  .math.math-display,
  .katex-display {
    display: block;
    margin: 0.55rem 0 0.65rem;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0.05rem 0.1rem 0.12rem;
  }

  .katex-display > .katex {
    min-width: fit-content;
    padding-top: 1px;
    padding-bottom: 1px;
  }

  article p + .katex-display,
  article p + .math.math-display {
    margin-top: 0.45rem;
  }

  article .katex-display + p,
  article .math.math-display + p {
    margin-top: 0.45rem;
  }

  article li .katex-display,
  article li .math.math-display {
    margin: 0.35rem 0 0.45rem;
  }

  nav#toc .generated-toc ul {
    margin: 0;
    padding-left: 0;
  }

  nav#toc .generated-toc li {
    margin: 0.35rem 0;
  }

  nav#toc .generated-toc li.toc-level-3 {
    padding-left: 1rem;
    font-size: 0.96em;
  }

  nav#toc .generated-toc a {
    text-decoration: none;
  }

  nav#toc .generated-toc a:hover {
    text-decoration: underline;
  }

  @media (max-width: 720px) {
    :root {
      --katex-font-size: 1.02em;
    }

    .math.math-display,
    .katex-display {
      margin: 0.5rem 0 0.6rem;
      padding-bottom: 0.08rem;
    }
  }
</style>
<script defer src="/assets/vendor/katex/katex.min.js"></script>
<script defer src="/assets/vendor/katex/contrib/auto-render.min.js"></script>
<script defer src="/assets/vendor/katex/contrib/copy-tex.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (window.katex) {
      // 1) Kodama-emitted math nodes
      document.querySelectorAll(".math.math-inline").forEach(function (el) {
        katex.render(el.textContent, el, {
          displayMode: false,
          throwOnError: false,
          strict: false,
        });
      });

      document.querySelectorAll(".math.math-display").forEach(function (el) {
        katex.render(el.textContent, el, {
          displayMode: true,
          throwOnError: false,
          strict: false,
        });
      });

      // 2) Raw delimiters fallback ($...$, $$...$$, \(...\), \[...\])
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ],
          throwOnError: false
        });
      }
    }

    var toc = document.querySelector("nav#toc");
    if (toc && !toc.querySelector(".block")) {
      var headings = Array.from(
        document.querySelectorAll("article h2, article h3")
      );

      if (headings.length) {
        var container = document.createElement("div");
        container.className = "block generated-toc";

        var details = document.createElement("details");
        details.open = true;

        var summary = document.createElement("summary");
        var title = document.createElement("h1");
        title.textContent = "Table of Contents";
        summary.appendChild(title);
        details.appendChild(summary);

        var list = document.createElement("ul");

        headings.forEach(function (heading, index) {
          if (!heading.id) {
            heading.id = "section-" + (index + 1);
          }

          var item = document.createElement("li");
          item.className = "toc-level-" + heading.tagName.toLowerCase().slice(1);

          var link = document.createElement("a");
          link.href = "#" + heading.id;
          link.textContent = heading.textContent.trim();

          item.appendChild(link);
          list.appendChild(item);
        });

        details.appendChild(list);
        container.appendChild(details);
        toc.appendChild(container);
      }
    }
  });
</script>
